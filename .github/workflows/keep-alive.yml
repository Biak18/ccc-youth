# Keeps the Supabase Postgres database (used by the CityYouth backend
# API) from pausing due to inactivity on the free tier.
#
# How: hit the backend's DB health check on a schedule. The query runs
# through the API, so this repo needs no Supabase secrets. Run manually
# any time from the Actions tab (workflow_dispatch).

name: Keep alive

on:
  schedule:
    # Every Monday at 03:00 UTC — well within Supabase's inactivity window.
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API database health check
        run: |
          curl --fail --max-time 60 --retry 3 --retry-delay 30 \
            https://ccc-youth-api-production.up.railway.app/api/health/db
